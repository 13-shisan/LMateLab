<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">DEMO MoS2 density of states</title>
  <desc id="desc">Filled total density of states and a second projected density trace versus energy.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="72" y="42" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">MoS2 density of states</text>
  <g stroke="#d9dee8" stroke-width="1">
    <path d="M90 90H900 M90 150H900 M90 210H900 M90 270H900 M90 330H900 M90 390H900 M90 450H900"/>
    <path d="M90 90V450 M225 90V450 M360 90V450 M495 90V450 M630 90V450 M765 90V450 M900 90V450"/>
  </g>
  <path d="M90 270H900" stroke="#687386" stroke-width="2" stroke-dasharray="8 7"/>
  <path d="M90 450 L155 432 L235 414 L340 395 L480 377 L615 358 L730 340 L590 322 L365 304 L155 286 L90 270 L105 252 L120 234 L180 216 L295 198 L455 180 L670 162 L810 144 L675 126 L430 108 L245 90 L90 90 Z" fill="#2b78bd" fill-opacity="0.24" stroke="#1769aa" stroke-width="3" stroke-linejoin="round"/>
  <polyline points="90,450 125,432 180,414 255,396 310,378 250,360 170,342 115,324 98,306 90,288 90,270 100,252 130,234 210,216 345,198 520,180 590,162 455,144 280,126 160,108 105,90" fill="none" stroke="#c43d4e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#172033" stroke-width="2"><path d="M90 90V450H900" fill="none"/></g>
  <g fill="#3b4658" font-family="Arial, sans-serif" font-size="15">
    <text x="90" y="478" text-anchor="middle">0</text><text x="225" y="478" text-anchor="middle">1</text>
    <text x="360" y="478" text-anchor="middle">2</text><text x="495" y="478" text-anchor="middle">3</text>
    <text x="630" y="478" text-anchor="middle">4</text><text x="765" y="478" text-anchor="middle">5</text>
    <text x="900" y="478" text-anchor="middle">6</text>
    <text x="73" y="455" text-anchor="end">-3</text><text x="73" y="395" text-anchor="end">-2</text>
    <text x="73" y="335" text-anchor="end">-1</text><text x="73" y="275" text-anchor="end">0</text>
    <text x="73" y="215" text-anchor="end">1</text><text x="73" y="155" text-anchor="end">2</text>
    <text x="73" y="95" text-anchor="end">3</text>
  </g>
  <text x="495" y="517" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="17">Density of states</text>
  <text x="24" y="270" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="17" transform="rotate(-90 24 270)">Energy (eV)</text>
  <text x="520" y="305" text-anchor="middle" fill="#a8afbb" fill-opacity="0.28" font-family="Arial, sans-serif" font-size="92" font-weight="800" transform="rotate(-13 520 305)">DEMO</text>
</svg>

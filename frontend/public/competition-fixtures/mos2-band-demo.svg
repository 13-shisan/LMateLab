<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">DEMO MoS2 band structure</title>
  <desc id="desc">Four electronic band traces along the Gamma-M-K-Gamma-M high-symmetry path.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
  <text x="72" y="42" fill="#172033" font-family="Arial, sans-serif" font-size="24" font-weight="700">MoS2 band structure</text>
  <g stroke="#d9dee8" stroke-width="1">
    <path d="M90 90H900 M90 150H900 M90 210H900 M90 270H900 M90 330H900 M90 390H900 M90 450H900"/>
    <path d="M90 90V450 M292.5 90V450 M495 90V450 M697.5 90V450 M900 90V450"/>
  </g>
  <path d="M90 270H900" stroke="#687386" stroke-width="2" stroke-dasharray="8 7"/>
  <g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="3">
    <polyline stroke="#1769aa" points="90,370 145,350 210,323 292.5,288 360,305 430,325 495,336 555,320 620,295 697.5,270 760,288 830,310 900,322"/>
    <polyline stroke="#4389c7" points="90,418 150,400 220,382 292.5,360 365,348 430,354 495,365 565,350 635,330 697.5,318 765,330 835,350 900,362"/>
    <polyline stroke="#c43d4e" points="90,188 150,175 220,160 292.5,148 360,165 430,148 495,118 560,132 625,155 697.5,168 760,150 830,135 900,126"/>
    <polyline stroke="#e06570" points="90,230 155,216 225,202 292.5,190 360,205 430,193 495,174 565,185 630,206 697.5,214 765,198 835,180 900,170"/>
  </g>
  <g stroke="#172033" stroke-width="2">
    <path d="M90 90V450H900" fill="none"/>
  </g>
  <g fill="#3b4658" font-family="Arial, sans-serif" font-size="15">
    <text x="73" y="455" text-anchor="end">-3</text><text x="73" y="395" text-anchor="end">-2</text>
    <text x="73" y="335" text-anchor="end">-1</text><text x="73" y="275" text-anchor="end">0</text>
    <text x="73" y="215" text-anchor="end">1</text><text x="73" y="155" text-anchor="end">2</text>
    <text x="73" y="95" text-anchor="end">3</text>
    <text x="90" y="478" text-anchor="middle">Γ</text><text x="292.5" y="478" text-anchor="middle">M</text>
    <text x="495" y="478" text-anchor="middle">K</text><text x="697.5" y="478" text-anchor="middle">Γ</text>
    <text x="900" y="478" text-anchor="middle">M</text>
  </g>
  <text x="495" y="517" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="17">High-symmetry path</text>
  <text x="24" y="270" text-anchor="middle" fill="#172033" font-family="Arial, sans-serif" font-size="17" transform="rotate(-90 24 270)">Energy (eV)</text>
  <text x="500" y="305" text-anchor="middle" fill="#a8afbb" fill-opacity="0.28" font-family="Arial, sans-serif" font-size="92" font-weight="800" transform="rotate(-13 500 305)">DEMO</text>
</svg>
